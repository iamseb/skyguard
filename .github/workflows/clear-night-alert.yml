name: SkyGuard — Clear Night Alert

on:
  schedule:
    # Cron is UTC and doesn't follow daylight saving, so each run fires both
    # candidate slots and the script only runs the one that lands on the local
    # hour (OUTLOOK_HOUR / EVENING_HOUR in main.py), skipping its twin.
    # Midday outlook (tonight + tomorrow) at 12:00 local —
    # 10:00 UTC = 12:00 CEST, 11:00 UTC = 12:00 CET.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    # Evening update for tonight at 18:00 local —
    # 16:00 UTC = 18:00 CEST, 17:00 UTC = 18:00 CET.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "outlook = tonight + tomorrow (midday) · tonight = evening update"
        type: choice
        options: [outlook, tonight]
        default: outlook
      dry_run:
        description: "Print the message instead of sending a push"
        type: boolean
        default: false

# Never let two runs race on the forecast history.
concurrency:
  group: skyguard
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Forecast history (per-night verdicts from earlier runs) lives in the
      # Actions cache, not the repo, so nothing about the site is committed.
      # Each run restores the newest copy and saves a fresh one.
      - name: Restore forecast history
        uses: actions/cache/restore@v4
        with:
          path: .skyguard
          key: skyguard-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: skyguard-state-
      - run: python main.py
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          # Location lives in Secrets (encrypted, not publicly visible) rather
          # than Variables, so coordinates are never exposed on a public repo.
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          # Optional: set an Actions Variable DAILY_DIGEST=1 for a short status
          # every day (not just on clear nights). Not sensitive, so a Variable
          # rather than a Secret. Unset = silent unless a night qualifies.
          DAILY_DIGEST: ${{ vars.DAILY_DIGEST }}
          # The midday crons are the outlook; the evening crons are "tonight".
          RUN_MODE: ${{ inputs.mode || ((github.event.schedule == '0 10 * * *' || github.event.schedule == '0 11 * * *') && 'outlook' || 'tonight') }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - name: Save forecast history
        if: hashFiles('.skyguard/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .skyguard
          key: skyguard-state-${{ github.run_id }}-${{ github.run_attempt }}
